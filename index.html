<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akshay Soni - Resume</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .header {
      padding: 12px 16px;
      background: #111;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 500;
    }

    .actions a {
      text-decoration: none;
      color: #fff;
      background: #007bff;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      margin-left: 8px;
    }

    .actions a:hover {
      background: #0056b3;
    }

    .viewer {
      flex: 1;
      background: #ccc;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Fallback message */
    .fallback {
      display: none;
      text-align: center;
      padding: 40px;
    }

    /* Print optimization */
    @media print {
      .header {
        display: none;
      }

      body, html {
        height: auto;
      }

      iframe {
        height: 100%;
      }
    }

    /* Mobile optimization */
    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .actions {
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    
    <!-- Header -->
    <div class="header">
      <h1>Akshay Soni - Resume</h1>
      <div class="actions">
        <a href="Akshay-Soni-Resume.pdf" target="_blank">Open</a>
        <a href="Akshay-Soni-Resume.pdf" download>Download</a>
      </div>
    </div>

    <!-- PDF Viewer -->
    <div class="viewer">
      <iframe 
        src="Akshay-Soni-Resume.pdf"
        onerror="showFallback()">
      </iframe>

      <!-- Fallback -->
      <div class="fallback" id="fallback">
        <p>Your browser cannot display the resume.</p>
        <p>
          <a href="Akshay-Soni-Resume.pdf" target="_blank">
            Click here to view/download
          </a>
        </p>
      </div>
    </div>

  </div>

  <script>
    function showFallback() {
      document.querySelector("iframe").style.display = "none";
      document.getElementById("fallback").style.display = "block";
    }
  </script>
</body>
</html>
